<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>2048</h1>
        <div class="header-buttons">
            <button id="restart-button-header" class="header-button">New Game</button>
            <button id="theme-button" class="header-button">Theme</button>
        </div>
    </div>
    <div class="scores-container">
        <div class="score-box">
            <div>SCORE</div>
            <div id="score">0</div>
        </div>
        <div class="score-box">
            <div>BEST</div>
            <div id="best-score">0</div>
        </div>
    </div>
    <div class="game-container">
        <div class="grid-container">
            <!-- Grid cells will be generated by JavaScript -->
        </div>
        <div class="tile-container">
            <!-- Tiles will be generated by JavaScript -->
        </div>
    </div>
    <div class="game-over-message" id="game-over-message">
        <div class="game-over-text">Game Over!</div>
        <div class="game-over-buttons">
            <button id="share-button" class="header-button">Share</button>
            <button id="restart-button-gameover" class="header-button">Try Again</button>
        </div>
    </div>
    <p class="game-instructions">
        Use your arrow keys to move the tiles. When two tiles with the same number touch, they merge into one!
    </p>
    <script src="script.js"></script>
</body>
</html>
